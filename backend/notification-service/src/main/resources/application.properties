spring.application.name=notification-service
server.port=${SERVER_PORT:8084}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
management.endpoints.web.exposure.include=health,info

notification.internal-key=${NOTIFICATION_INTERNAL_KEY:change-this-local-internal-key}
notification.email.enabled=${ORDER_EMAIL_ENABLED:false}
notification.email.from=${ORDER_EMAIL_FROM:${SMTP_USERNAME:no-reply@clearly.local}}
notification.email.sender-name=${ORDER_EMAIL_SENDER_NAME:Clearly Orders}
notification.email.reply-to=${ORDER_EMAIL_REPLY_TO:}

notification.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
notification.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
notification.twilio.sms.enabled=${ORDER_SMS_ENABLED:false}
notification.twilio.sms.from=${TWILIO_SMS_FROM:}
notification.twilio.whatsapp.enabled=${ORDER_WHATSAPP_ENABLED:false}
notification.twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:}
notification.twilio.whatsapp.content-sid=${TWILIO_WHATSAPP_CONTENT_SID:}
notification.phone.default-country-code=${ORDER_PHONE_COUNTRY_CODE:+91}
notification.storefront-url=${STOREFRONT_PUBLIC_URL:http://127.0.0.1:4173}
notification.contact-enquiry-to=${CONTACT_ENQUIRY_TO:adhithyachem@gmail.com}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

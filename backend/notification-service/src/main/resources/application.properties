spring.application.name=notification-service
server.port=${SERVER_PORT:8084}
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
#spring.cloud.features.=/functions
# deprecated in the new update, if want, use @RestController and @RequestMapping

#info.app.name=Category Service
#info.app.description=Microservice for managing product categories
#info.app.version=1.0.9


notification.internal-key=${NOTIFICATION_INTERNAL_KEY:clearly-local-notification-key-change-before-production}
notification.email.enabled=${ORDER_EMAIL_ENABLED:false}
notification.email.from=${ORDER_EMAIL_FROM:${SMTP_USERNAME:no-reply@clearly.local}}
notification.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
notification.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
notification.twilio.sms.enabled=${ORDER_SMS_ENABLED:false}
notification.twilio.sms.from=${TWILIO_SMS_FROM:}
notification.twilio.whatsapp.enabled=${ORDER_WHATSAPP_ENABLED:false}
notification.twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:}
notification.twilio.whatsapp.content-sid=${TWILIO_WHATSAPP_CONTENT_SID:}
notification.phone.default-country-code=${ORDER_PHONE_COUNTRY_CODE:+91}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

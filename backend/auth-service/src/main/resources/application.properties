spring.application.name=auth-service
server.port=${SERVER_PORT:8085}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info
management.health.mail.enabled=${AUTH_MAIL_ENABLED:false}
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/clearly_store?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
auth.jwt.secret=${JWT_SECRET:clearly-local-development-secret-change-before-production-2026}
auth.jwt.expiry-hours=${JWT_EXPIRY_HOURS:24}
auth.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:10}
auth.otp.dev-expose=${AUTH_DEV_EXPOSE_OTP:true}
auth.google.client-id=${GOOGLE_CLIENT_ID:1046108917884-krla6pdp7adldad7hbigp0a3n1kbi83d.apps.googleusercontent.com}
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
auth.mail.enabled=${AUTH_MAIL_ENABLED:false}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

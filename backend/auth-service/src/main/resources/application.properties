spring.application.name=auth-service
server.port=${SERVER_PORT:8085}
server.error.include-message=always
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=16MB

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info
management.health.mail.enabled=${AUTH_MAIL_ENABLED:false}

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/clearly_store?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

auth.jwt.secret=${JWT_SECRET:change-this-local-jwt-secret-before-production}
auth.jwt.expiry-hours=${JWT_EXPIRY_HOURS:24}
auth.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:10}
auth.otp.dev-expose=${AUTH_DEV_EXPOSE_OTP:true}
auth.google.client-id=${GOOGLE_CLIENT_ID:}

razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8084}
notification.internal-key=${NOTIFICATION_INTERNAL_KEY:change-this-local-internal-key}
storefront.public-url=${STOREFRONT_PUBLIC_URL:http://127.0.0.1:4173}

auth.mail.enabled=${AUTH_MAIL_ENABLED:false}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

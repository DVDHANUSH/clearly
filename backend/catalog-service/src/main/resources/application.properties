spring.application.name=catalog-service
server.port=${SERVER_PORT:8081}
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/clearly_store?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:password}
auth.jwt.secret=${JWT_SECRET:clearly-local-development-secret-change-before-production-2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}
management.endpoints.web.exposure.include=health,info
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
delivery.estimate.minimum-business-days=${DELIVERY_MIN_BUSINESS_DAYS:3}
delivery.estimate.maximum-business-days=${DELIVERY_MAX_BUSINESS_DAYS:5}

spring.application.name=config-server
server.port=${SERVER_PORT:8888}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
spring.profiles.active=git
spring.cloud.config.server.git.uri=${CONFIG_REPOSITORY_URL:https://github.com/DVDHANUSH/minup-config.git}
spring.cloud.config.server.git.default-label=${CONFIG_REPOSITORY_BRANCH:main}
spring.cloud.config.server.git.timeout=10
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.force-pull=true
encrypt.key=${CONFIG_ENCRYPT_KEY:change-this-local-encryption-key}

management.endpoints.web.exposure.include=health,info
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
